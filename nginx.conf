server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    include /etc/nginx/security-headers.inc;

    location /js/ {
        include /etc/nginx/security-headers.inc;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        try_files $uri =404;
    }

    location /assets/ {
        include /etc/nginx/security-headers.inc;
        add_header Cache-Control "public, max-age=86400, immutable" always;
        try_files $uri =404;
    }

    # GLB is already a packed binary format. Dynamic gzip on the HTTP/2/3
    # path made avatar responses crawl, leaving every NPC stuck in loading.
    location ~* \.glb$ {
        include /etc/nginx/security-headers.inc;
        gzip off;
        add_header Cache-Control "public, max-age=86400, immutable, no-transform" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
